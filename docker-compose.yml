services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortener-app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: shortener
      DB_USERNAME: shortener
      DB_PASSWORD: secret
    depends_on:
      db: 
        condition: service_healthy    
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan key:generate --force && php artisan migrate --force && php-fpm"

  web:
    image: nginx:alpine
    container_name: shortener-web
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.4
    container_name: shortener-db
    environment:
      MYSQL_DATABASE: shortener
      MYSQL_USER: shortener
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3306:3306"
    volumes:
      - shortener_db:/var/lib/mysql

  frontend:
    image: node:20-alpine
    container_name: shortener-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  shortener_db:
